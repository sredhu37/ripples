name: factory-pr-link

# A PR opened by hand that closes an issue puts the issue in review.
# Spec: docs/factory.md, section Labels and board. Script: .github/scripts/pr-in-review.sh.
#
#   PR opened, reopened or ready for review, Closes #n -> #n gets factory:in-review, card In review
#
# The factory sets in-review itself for its own PRs; this covers PRs built by hand (for example
# the ones that change workflow files, which the Claude App cannot push). The script skips drafts,
# forks, and issues that are in human, in-review or done.
#
# pull_request_target runs this file from main, and the job checks out main only, never the PR head:
# a PR cannot change what runs here. FACTORY_TOKEN is used only for the board move, and no agent runs.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: factory-pr-link-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  link:
    # Same-repo PRs only: a fork PR gets no secrets and no checkout here (the script checks it again).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # scripts
      issues: write # labels
      pull-requests: read # closing issues
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Issues this PR closes go to In review
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/pr-in-review.sh "$PR"
