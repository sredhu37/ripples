name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Markdown-only PR (docs/factory.md, CI tools): the jobs below skip; a skipped required check passes.
  changes:
    uses: ./.github/workflows/md-only.yml

  ci:
    name: ci
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.md_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
