name: Deploy to GitHub Pages

# Spec: docs/factory.md, section Deploy and live check.
# build -> deploy -> live-check. Pass: tag live-good moves to this commit.
# Fail: rollback-build + rollback-deploy put tag live-good back on the live site,
# then report opens a revert PR (as the bot) and messages Sunny on Telegram.

on:
  push:
    branches: [main]
    # A markdown-only push (every file *.md, none under .claude/) starts no deploy: same rule as
    # .github/scripts/md-only.sh. A path filter is fine here, pages is not a required check.
    paths:
      - "**"
      - "!**.md"
      - ".claude/**"
  workflow_dispatch:
    inputs:
      simulate_broken:
        description: Fail the live check on purpose to test the rollback (no revert PR, Telegram says SIMULATED)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Queue runs instead of cancelling them: a cancelled run could stop halfway through a rollback.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://sredhu37.github.io/ripples/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Write version.txt (the live check waits for this commit id)
        run: printf '%s\n' "$GITHUB_SHA" > dist/version.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  live-check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait until the live site serves this commit
        run: .github/scripts/pages-wait-version.sh "$GITHUB_SHA" 600
      # No speed limits here: live network varies, speed is checked before merge (lighthouse.yml).
      # lhci fails the step when the page paints nothing (NO_FCP) or the console logs an error.
      - name: Lighthouse on the live URL (page renders, no console errors)
        run: npx --yes @lhci/cli@0.16.0 autorun --config=.github/scripts/pages-lighthouserc.json "--collect.url=${SITE_URL}?v=${GITHUB_SHA}"
      - name: Simulated failure
        if: inputs.simulate_broken
        run: |
          echo "::error::simulate_broken is set: failing the live check on purpose to test the rollback."
          exit 1
      - name: Move tag live-good to this commit
        run: |
          git tag -f live-good "$GITHUB_SHA"
          git push --force origin refs/tags/live-good
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore

  rollback-build:
    needs: live-check
    if: always() && needs.live-check.result == 'failure'
    runs-on: ubuntu-latest
    outputs:
      good_sha: ${{ steps.good.outputs.sha }}
    steps:
      - name: Check that tag live-good exists
        run: |
          if ! git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/tags/live-good >/dev/null; then
            echo "::error::Rollback impossible: tag live-good does not exist. Place it on a known good commit of main (git tag live-good <sha> && git push origin live-good), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: live-good
          persist-credentials: false
      - id: good
        name: Find the live-good commit
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Rolling back to live-good: $sha ($(git log -1 --format=%s))"
          if [ "$sha" = "$GITHUB_SHA" ]; then
            echo "::warning::live-good already points at this commit, so the rollback redeploys the same code."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Write version.txt for the live-good commit
        run: git rev-parse HEAD > dist/version.txt
      # Own artifact name: this run already holds the "github-pages" artifact of the failed deploy.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-rollback
          path: dist

  # Separate job from the upload: deploy-pages finds artifacts by listing them, which can miss
  # an artifact uploaded a moment earlier in the same job (actions/deploy-pages#451).
  rollback-deploy:
    needs: rollback-build
    # always(): live-check failed upstream, which would otherwise skip this job.
    if: always() && needs.rollback-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait until the live site serves live-good
        env:
          GOOD_SHA: ${{ needs.rollback-build.outputs.good_sha }}
        run: .github/scripts/pages-wait-version.sh "$GOOD_SHA" 600

  report:
    needs: [live-check, rollback-build, rollback-deploy]
    if: always() && needs.live-check.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ROLLBACK_RESULT: build ${{ needs.rollback-build.result }}, deploy ${{ needs.rollback-deploy.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # FACTORY_TOKEN (the bot), not GITHUB_TOKEN, so the revert PR's checks start on their own.
      - name: Open a revert PR as the bot
        id: revert
        if: ${{ !inputs.simulate_broken }}
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          BROKEN_SHA: ${{ github.sha }}
        run: .github/scripts/pages-revert-pr.sh
      - name: Message Sunny on Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIMULATED: ${{ inputs.simulate_broken && 'true' || 'false' }}
          DEPLOY_RESULT: ${{ needs.rollback-deploy.result }}
          GOOD_SHA: ${{ needs.rollback-build.outputs.good_sha }}
          PR_URL: ${{ steps.revert.outputs.pr_url }}
          PR_NOTE: ${{ steps.revert.outputs.note }}
          REVERT_OUTCOME: ${{ steps.revert.outcome }}
        run: .github/scripts/pages-notify.sh
