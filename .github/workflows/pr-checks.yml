name: pr-checks

# map-does: Every PR check, one job per required check of the main ruleset, plus the workflow map and flow diagram checks.

# Every check that runs on a pull request, one job per required check of the main ruleset:
# ci, lint, audit, lighthouse, spec-rule, flow-rule, demo. Job names are the check names; keep them.
# factory-review.yml starts when this workflow completes on a factory PR.
#
# demo posts the evidence: step screenshots and demo.mp4 on the `evidence` branch under
# pr-<n>/, and one PR comment (found by the <!-- evidence --> marker) updated in place.
# See docs/factory.md, sections CI tools and Evidence.

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # Postgres for the API and migration tests. Without DATABASE_URL those tests are skipped.
    # POSTGRES_USER is the superuser of the container, so it may create the throwaway test database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ripples
          POSTGRES_PASSWORD: ripples
          POSTGRES_DB: ripples
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ripples -d ripples"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            server/package-lock.json
      - run: npm run install:all
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: postgres://ripples:ripples@localhost:5432/ripples
      - run: npm run build

  workflows-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm run workflows:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            server/package-lock.json
      - run: npm audit
      - run: npm audit
        working-directory: web
      - run: npm audit
        working-directory: server

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # Config in web/lighthouserc.json: vite preview on port 4733, 3 runs, speed and accessibility limits.
      # One retry for runner noise (checks/lighthouse.sh).
      - working-directory: web
        run: ../.github/scripts/checks/lighthouse.sh
      - name: Show median numbers in the job summary
        if: always()
        working-directory: web
        run: node ../.github/scripts/checks/lighthouse-summary.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: web/.lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore

  spec-rule:
    runs-on: ubuntu-latest
    concurrency:
      group: spec-rule-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Unit test of the spec rule
        run: npx vitest run --root scripts
      - name: Specs present (a *.tsx or *.css change needs an e2e/*.spec.ts change)
        run: node scripts/check-spec-changed.mjs "origin/${{ github.base_ref }}"

  flow-rule:
    runs-on: ubuntu-latest
    concurrency:
      group: flow-rule-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Unit test of the flow rule
        run: npx vitest run --root scripts check-flow-changed
      - name: Flow diagram current (a workflow or script change needs a docs/factory-flow.svg change)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-flow-changed.mjs "origin/${{ github.base_ref }}"

  demo:
    runs-on: ubuntu-latest
    concurrency:
      group: demo-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write # push to the evidence branch
      pull-requests: write # create or update the evidence comment
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVIDENCE_OUT: ${{ github.workspace }}/../evidence-out
      # A fork's token cannot push or comment.
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/e2e/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: web/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: web/e2e

      - name: Lesson ids from changed web/src/content/<id>.* files
        id: lessons
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/checks/lesson-ids.sh

      - name: Specs (all, video on)
        id: specs
        working-directory: web/e2e
        env:
          LESSON_IDS: ${{ steps.lessons.outputs.ids }}
        run: ../../.github/scripts/checks/specs.sh

      - id: upload
        if: always() && steps.specs.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: demo-video
          path: web/e2e/test-results/**/video.webm
          retention-days: 90
          if-no-files-found: warn

      - name: ffmpeg (installed with apt if the runner lacks it)
        if: always() && steps.specs.outcome != 'skipped'
        run: .github/scripts/checks/ffmpeg.sh

      - name: Build evidence (screenshots, demo.mp4, comment)
        if: always() && steps.specs.outcome != 'skipped'
        working-directory: web/e2e
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SPECS_OUTCOME: ${{ steps.specs.outcome }}
          SPECS_SECONDS: ${{ steps.specs.outputs.seconds }}
        run: node build-evidence.mjs "$EVIDENCE_OUT"

      - name: Push evidence to the evidence branch
        id: push
        if: always() && steps.specs.outcome != 'skipped' && env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/checks/evidence-push.sh

      - name: Create or update the evidence comment
        if: always() && steps.specs.outcome != 'skipped' && env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_SHA: ${{ steps.push.outputs.sha }}
        run: .github/scripts/checks/evidence-comment.sh
