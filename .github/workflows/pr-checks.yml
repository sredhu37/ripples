name: pr-checks

# Every check that runs on a pull request, one job per required check of the main ruleset:
# ci, lint, audit, lighthouse, spec-rule, demo. Job names are the check names; keep them.
# factory-review.yml starts when this workflow completes on a factory PR.
#
# demo posts the evidence: step screenshots and demo.mp4 on the `evidence` branch under
# pr-<n>/, and one PR comment (found by the <!-- evidence --> marker) updated in place.
# See docs/factory.md, sections CI tools and Evidence.

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm audit

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Config in lighthouserc.json: vite preview on port 4733, 3 runs, speed and accessibility limits.
      # Shared runners are noisy: a median can land over a limit with no app change. One retry;
      # a real slowdown fails both tries.
      - run: |
          if npx --yes @lhci/cli@0.16.0 autorun; then exit 0; fi
          echo "::warning::Lighthouse failed once, retrying (runner noise check)"
          rm -rf .lighthouseci
          npx --yes @lhci/cli@0.16.0 autorun
      - name: Show median numbers in the job summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const dir = ".lighthouseci";
            const lhrs = fs.readdirSync(dir).filter((f) => /^lhr-.*\.json$/.test(f)).map((f) => JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8")));
            const median = (xs) => xs.sort((a, b) => a - b)[Math.floor((xs.length - 1) / 2)];
            const m = (id) => median(lhrs.map((r) => r.audits[id].numericValue));
            const failing = [...new Set(lhrs.flatMap((r) => r.categories.accessibility.auditRefs.map((a) => r.audits[a.id]).filter((a) => a.score !== null && a.score < 1).map((a) => a.id)))];
            const lines = [
              `Lighthouse median of ${lhrs.length} runs`,
              "",
              `| Metric | Median | Limit |`,
              `|---|---|---|`,
              `| LCP | ${Math.round(m("largest-contentful-paint"))} ms | 2500 ms |`,
              `| CLS | ${m("cumulative-layout-shift").toFixed(3)} | 0.1 |`,
              `| TBT | ${Math.round(m("total-blocking-time"))} ms | 200 ms |`,
              "",
              `Failing accessibility audits: ${failing.length ? failing.join(", ") : "none"}`,
            ];
            console.log(lines.join("\n"));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore

  spec-rule:
    runs-on: ubuntu-latest
    concurrency:
      group: spec-rule-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit test of the spec rule
        run: npx vitest run --root scripts
      - name: Specs present (a *.tsx or *.css change needs an e2e/*.spec.ts change)
        run: node scripts/check-spec-changed.mjs "origin/${{ github.base_ref }}"

  demo:
    runs-on: ubuntu-latest
    concurrency:
      group: demo-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write # push to the evidence branch
      pull-requests: write # create or update the evidence comment
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVIDENCE_OUT: ${{ github.workspace }}/../evidence-out
      # A fork's token cannot push or comment.
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Lesson ids from changed src/content/<id>.* files
        id: lessons
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ids=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- src/content \
            | grep -v '^src/content/senior/' \
            | sed -nE 's#^src/content/([a-z0-9_]+)\..*$#\1#p' \
            | sort -u \
            | while read -r id; do
                if [ -f "src/content/$id.tsx" ] && grep -q "id: \"$id\"" src/lessons.ts; then echo "$id"; fi
              done \
            | paste -sd, -)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Lesson ids: ${ids:-none changed, the spec uses money}"

      - name: Specs (all, video on)
        id: specs
        working-directory: e2e
        env:
          LESSON_IDS: ${{ steps.lessons.outputs.ids }}
        run: |
          start=$(date +%s)
          set +e
          npx playwright test
          status=$?
          seconds=$(( $(date +%s) - start ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "Spec run time: ${seconds}s (exit $status)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      - id: upload
        if: always() && steps.specs.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: demo-video
          path: e2e/test-results/**/video.webm
          retention-days: 90
          if-no-files-found: warn

      - name: ffmpeg (installed with apt if the runner lacks it)
        if: always() && steps.specs.outcome != 'skipped'
        run: |
          if command -v ffmpeg > /dev/null; then
            echo "ffmpeg is preinstalled on this runner"
          else
            echo "ffmpeg missing, installing with apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg > /dev/null
          fi
          ffmpeg -version | head -n 1

      - name: Build evidence (screenshots, demo.mp4, comment)
        if: always() && steps.specs.outcome != 'skipped'
        working-directory: e2e
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SPECS_OUTCOME: ${{ steps.specs.outcome }}
          SPECS_SECONDS: ${{ steps.specs.outputs.seconds }}
        run: node build-evidence.mjs "$EVIDENCE_OUT"

      - name: Push evidence to the evidence branch
        id: push
        if: always() && steps.specs.outcome != 'skipped' && env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="pr-$PR_NUMBER"
          repo_dir="$RUNNER_TEMP/evidence-repo"
          git init -q "$repo_dir"
          cd "$repo_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Retry from a fresh fetch: another PR may push, or cleanup may rewrite the branch.
          for attempt in 1 2 3 4; do
            if git ls-remote --exit-code --heads origin evidence > /dev/null; then
              git fetch -q --depth 1 origin evidence
              git checkout -q -f -B "work-$attempt" FETCH_HEAD
            else
              echo "No evidence branch yet, starting an orphan branch"
              git checkout -q -f --orphan "work-$attempt"
              git rm -rq --cached . > /dev/null 2>&1 || true
            fi
            rm -rf "$dir"
            cp -R "$EVIDENCE_OUT/$dir" "$dir"
            git add -A "$dir"
            if git diff --cached --quiet; then
              echo "Evidence unchanged"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -q -m "Evidence for PR #$PR_NUMBER at ${HEAD_SHA:0:7}"
            if git push -q origin "HEAD:refs/heads/evidence"; then
              echo "Pushed $dir to evidence"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $(( attempt * 5 ))
          done
          echo "Could not push to the evidence branch"
          exit 1

      - name: Create or update the evidence comment
        if: always() && steps.specs.outcome != 'skipped' && env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          body="$EVIDENCE_OUT/comment.md"
          # The video link is pinned to the evidence commit just pushed.
          sed -i "s/__EVIDENCE_SHA__/${EVIDENCE_SHA:-evidence}/g" "$body"
          ids=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- evidence -->"))) | .id')
          id="${ids%%$'\n'*}"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" --jq .html_url
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$body" --jq .html_url
          fi
