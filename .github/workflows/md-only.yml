name: md-only

# Called by ci.yml, demo.yml and lighthouse.yml as their first job (`changes`).
# Output md_only=true when the PR changes only *.md files outside .claude/ (.github/scripts/md-only.sh).
# Their slow jobs then skip with a job-level if; a skipped job counts as passed for a required check.
# No path filter on those workflows: a required check skipped by a path filter stays "Expected".
# Spec: docs/factory.md, section CI tools.

on:
  workflow_call:
    outputs:
      md_only:
        description: "true when every changed file ends in .md and none is under .claude/"
        value: ${{ jobs.changes.outputs.md_only }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      md_only: ${{ steps.md.outputs.md_only }}
    steps:
      # Depth 2: HEAD is the PR's merge commit, HEAD^1 the base branch it merges into.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Markdown-only change?
        id: md
        run: .github/scripts/md-only.sh HEAD^1 HEAD
