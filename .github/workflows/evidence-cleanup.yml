name: evidence-cleanup

# map-does: Deletes the merged PR's folder from the evidence branch and squashes the branch.

# After a PR is merged, delete its pr-<n>/ folder from the `evidence` branch
# and rewrite the branch to a single commit, so old screenshots do not pile up.
# Force-push is allowed: only main is protected.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Remove pr-<n>/ and squash the evidence branch
        run: .github/scripts/evidence-cleanup/remove-pr.sh
