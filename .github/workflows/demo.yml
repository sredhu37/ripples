name: demo-video

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hashFiles is not allowed in a job-level `if`, so the e2e check is a step.
      - id: e2e
        run: |
          if [ -f e2e/playwright.config.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No e2e/playwright.config.ts, skipping the demo video."
          fi
      - if: steps.e2e.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
        if: ${{ steps.e2e.outputs.present == 'true' && hashFiles('package-lock.json') != '' }}
      - run: npm install
        if: steps.e2e.outputs.present == 'true'
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        if: steps.e2e.outputs.present == 'true'
        working-directory: e2e
      - run: npx playwright test
        if: steps.e2e.outputs.present == 'true'
        working-directory: e2e
      - id: upload
        if: always() && steps.e2e.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: e2e/test-results/**/video.webm
          if-no-files-found: warn
      - if: always() && steps.upload.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "Demo video, download the artifact zip: ${{ steps.upload.outputs.artifact-url }}"
