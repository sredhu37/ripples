name: factory-build

# The factory's build station. Spec: docs/factory.md, sections Build, Engine,
# Identity secrets and permissions, Labels and board.
#
#   issues labeled factory:ready, or workflow_dispatch (hourly sweep, manual run)
#     pickup:  skip if any blocker is open; label factory:ready -> factory:in-progress; board In progress
#     build:   claude-code-action with .claude/agents/build.md from main; branch factory/issue-<n>; opens the PR
#     finish:  PR open -> factory:in-review, board In review
#              usage limit -> factory:ready + "paused: usage limit" comment, board Ready
#              anything else -> factory:human + comment, board Needs human, Telegram
#   workflow_dispatch with pr (a fix round, dispatched by factory-review.yml after a FAIL)
#     pickup:  the issue keeps factory:in-review; the PR must be its open factory/issue-<n> PR
#     build:   same branch and PR; the prompt adds the latest review summary (fix every FAIL)
#     finish:  as above, but a fix round that pushed no new commit -> factory:human
#     A factory:ready issue whose branch already has an open PR (a paused fix round) runs as a fix round.
#   workflow_dispatch with pr and human (Sunny's comment on a PR in Needs human, dispatched by factory-gate.yml)
#     pickup:  the issue keeps factory:human; human is review:<id> or comment:<id> by sredhu37 on the PR
#     build:   same branch and PR; the prompt adds Sunny's comment: a question gets a reply, a change a commit
#     finish:  always back to factory:human, board Needs human, Telegram (once HUMAN, stays HUMAN);
#              no review round runs and none is counted
#   issues closed
#     unblock: dispatch this workflow for the oldest factory:ready issue the closed one was blocking
#
# Tokens: GITHUB_TOKEN for labels, comments and the dispatch (starts no issues runs, so no loops).
# FACTORY_TOKEN only for board moves, in jobs that run no agent. The build agent pushes and opens
# the PR as the Claude GitHub App (OIDC, id-token: write).

on:
  issues:
    types: [labeled, closed]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to build (it must have factory:ready, or factory:in-review with pr)
        required: true
        type: string
      pr:
        description: Fix round (factory-review sets it). The issue's open factory PR; the agent fixes every FAIL in its latest review summary
        required: false
        type: string
        default: ""
      human:
        description: Fix round from Sunny's comment (factory-gate sets it). review:<id> or comment:<id> by sredhu37 on pr; the issue keeps factory:human
        required: false
        type: string
        default: ""

# One build at a time; waiting builds queue (up to 100). Runs that cannot start a build
# (other labels, closed issues) get their own group so they never wait behind a build.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'factory:ready')) && 'factory-build' || format('factory-build-other-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

permissions: {}

env:
  TRUSTED_ACTORS: sredhu37,sredhu37-bot,claude[bot],github-actions[bot]

jobs:
  unblock:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read # scripts
      issues: read # dependencies
      actions: write # workflow_dispatch
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Start the oldest ready issue this one was blocking
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSED: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          next=$(.github/scripts/next-unblocked.sh "$CLOSED")
          if [ -z "$next" ]; then
            echo "Closing #$CLOSED unblocked no factory:ready issue"
            exit 0
          fi
          echo "Closing #$CLOSED unblocked #$next, starting its build"
          gh workflow run factory-build.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue="$next"

  pickup:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'factory:ready')
    runs-on: ubuntu-latest
    permissions:
      contents: read # scripts
      issues: write # label swap
    outputs:
      go: ${{ steps.check.outputs.go }}
      issue: ${{ steps.check.outputs.issue }}
      pr: ${{ steps.check.outputs.pr }}
      start_sha: ${{ steps.check.outputs.start_sha }}
      human: ${{ steps.check.outputs.human }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Ready (or a fix round), open and unblocked?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          FIX_PR: ${{ inputs.pr }}
          HUMAN: ${{ inputs.human }}
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Issue number '$ISSUE' is not a number"
            exit 1
          fi
          if [ -n "$FIX_PR" ] && ! [[ "$FIX_PR" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number '$FIX_PR' is not a number"
            exit 1
          fi
          if [ -n "$HUMAN" ] && { [ -z "$FIX_PR" ] || ! [[ "$HUMAN" =~ ^(review|comment):[0-9]+$ ]]; }; then
            echo "::error::human '$HUMAN' needs pr and the form review:<id> or comment:<id>"
            exit 1
          fi
          state=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" \
            --jq '[.state, (.pull_request != null), any(.labels[]; .name == "factory:ready"), any(.labels[]; .name == "factory:in-review"), any(.labels[]; .name == "factory:human")] | @tsv')
          read -r open_state is_pr ready in_review human_label <<< "$state"
          if [ "$is_pr" = "true" ] || [ "$open_state" != "open" ]; then
            echo "::notice::#$ISSUE skipped: needs to be an open issue (state $open_state)"
            exit 0
          fi
          if [ -n "$HUMAN" ]; then
            # Fix round from Sunny's comment (factory-gate): the issue stays factory:human.
            if [ "$human_label" != "true" ]; then
              echo "::notice::#$ISSUE skipped: a fix round from Sunny's comment needs factory:human"
              exit 0
            fi
            ready=false
          fi
          if [ -n "$FIX_PR" ]; then
            # Fix round from factory-review: the issue stays factory:in-review.
            if [ -z "$HUMAN" ] && [ "$in_review" != "true" ] && [ "$ready" != "true" ]; then
              echo "::notice::#$ISSUE skipped: a fix round needs factory:in-review or factory:ready"
              exit 0
            fi
            head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$FIX_PR" --jq '[.state, .head.ref, .head.repo.full_name] | @tsv')
            if [ "$head" != "$(printf 'open\tfactory/issue-%s\t%s' "$ISSUE" "$GITHUB_REPOSITORY")" ]; then
              echo "::error::PR #$FIX_PR is not the open factory PR of #$ISSUE ($head)"
              exit 1
            fi
            pr=$FIX_PR
          else
            if [ "$ready" != "true" ]; then
              echo "::notice::#$ISSUE skipped: needs factory:ready (ready $ready)"
              exit 0
            fi
            blockers=$(.github/scripts/open-blockers.sh "$ISSUE" | sed 's/^/#/' | paste -sd' ' -)
            if [ -n "$blockers" ]; then
              echo "::notice::#$ISSUE waits for open blockers: $blockers"
              exit 0
            fi
            # A paused fix round restarts from factory:ready: continue it as a fix round.
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "factory/issue-$ISSUE" --state open \
              --json number,headRepositoryOwner \
              --jq "[.[] | select(.headRepositoryOwner.login == \"$GITHUB_REPOSITORY_OWNER\")][0].number // \"\"")
          fi
          if [ -n "$pr" ]; then
            start_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)
            echo "Fix round on PR #$pr, head ${start_sha:0:7}"
            {
              echo "pr=$pr"
              echo "start_sha=$start_sha"
            } >> "$GITHUB_OUTPUT"
          fi
          {
            echo "issue=$ISSUE"
            echo "ready=$ready"
            echo "human=$HUMAN"
            echo "go=true"
          } >> "$GITHUB_OUTPUT"
      - name: Label factory:in-progress
        if: steps.check.outputs.go == 'true' && steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.check.outputs.issue }}
        run: .github/scripts/label-set.sh "$ISSUE" factory:in-progress
      - name: Board to In progress
        if: steps.check.outputs.go == 'true' && steps.check.outputs.ready == 'true'
        continue-on-error: true # the label is the truth; a board failure shows as an annotation
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          ISSUE: ${{ steps.check.outputs.issue }}
        run: .github/scripts/board-move.sh "$ISSUE" "In progress"

  build:
    needs: pickup
    if: needs.pickup.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout; the agent pushes with the Claude App token, not this one
      issues: read # issue text and trusted comments for the prompt
      id-token: write # claude-code-action exchanges OIDC for the Claude App token
    outputs:
      limit: ${{ steps.limit.outputs.limit }}
      limit_evidence: ${{ steps.limit.outputs.evidence }}
      last_words: ${{ steps.words.outputs.text }}
    env:
      ISSUE: ${{ needs.pickup.outputs.issue }}
      BRANCH: factory/issue-${{ needs.pickup.outputs.issue }}
      FIX_PR: ${{ needs.pickup.outputs.pr }}
      HUMAN: ${{ needs.pickup.outputs.human }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Branch factory/issue-<n> (continues a paused run's branch if it exists)
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch -q origin "$BRANCH"
            git switch -c "$BRANCH" FETCH_HEAD
            echo "Continuing existing branch $BRANCH at $(git rev-parse --short HEAD)"
          else
            git switch -c "$BRANCH"
            echo "New branch $BRANCH from main at $(git rev-parse --short HEAD)"
          fi
          # The agent writes the PR body here; git must never see it.
          echo ".factory-pr-body.md" >> .git/info/exclude

      - name: Prompt (build.md from main, issue, trusted comments)
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Rules come from main, never from a PR branch (docs/factory.md, Identity secrets and permissions).
          git show origin/main:.claude/agents/build.md | awk 'NR == 1 && /^---$/ { fm = 1; next } fm && /^---$/ { fm = 0; next } !fm' > "$RUNNER_TEMP/build.md"
          title=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .title)
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq '.body // ""' > "$RUNNER_TEMP/issue.md"
          # Only comments by trusted accounts reach the agent; the agent brief is one of them.
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" |
            jq -r -s --arg trusted "$TRUSTED_ACTORS" '
              add // [] | .[]
              | select(.user.login as $u | ($trusted | split(",") | index($u)) != null)
              | "### Comment by \(.user.login), \(.created_at)\n\n\(.body)\n"' \
            > "$RUNNER_TEMP/comments.md"
          # Fix round: the latest review summary on the PR (by github-actions[bot], marker on line 1).
          : > "$RUNNER_TEMP/fix.md"
          if [ -n "$HUMAN" ]; then
            # Sunny's comment, read again from the API: only sredhu37's own text reaches the agent.
            id=${HUMAN#*:}
            if [ "${HUMAN%%:*}" = "review" ]; then
              gh api "repos/$GITHUB_REPOSITORY/pulls/$FIX_PR/reviews/$id" > "$RUNNER_TEMP/human.json"
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$FIX_PR/reviews/$id/comments" |
                jq -r -s 'add // [] | .[] | "- \(.path):\(.line // .original_line // "file"): \(.body)"' > "$RUNNER_TEMP/human-inline.md"
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" > "$RUNNER_TEMP/human.json"
              : > "$RUNNER_TEMP/human-inline.md"
            fi
            author=$(jq -r '.user.login' "$RUNNER_TEMP/human.json")
            if [ "$author" != "sredhu37" ]; then
              echo "::error::$HUMAN is by $author, not sredhu37"
              exit 1
            fi
            {
              echo "This is a fix round for PR #$FIX_PR on $BRANCH, started by Sunny's comment below."
              echo "The PR is in Needs human: it goes back to Sunny after this round, not to review."
              echo "If the comment asks a question, answer it with gh pr comment $FIX_PR and change no code."
              echo "If it asks for a change, make it, push new commits (never force-push), and update the PR"
              echo "body with gh pr edit (rewrite Verified with this round's real output). Then reply with"
              echo "gh pr comment $FIX_PR in one or two sentences: what you changed, or why you did not."
              echo ""
              echo "<sunny_comment pr=\"$FIX_PR\" source=\"$HUMAN\" note=\"by sredhu37, the owner\">"
              jq -r '.body // ""' "$RUNNER_TEMP/human.json"
              if [ -s "$RUNNER_TEMP/human-inline.md" ]; then
                echo ""
                echo "Line comments:"
                cat "$RUNNER_TEMP/human-inline.md"
              fi
              echo "</sunny_comment>"
            } > "$RUNNER_TEMP/fix.md"
          elif [ -n "$FIX_PR" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$FIX_PR/comments" |
              jq -r -s '[add // [] | .[]
                | select(.user.login == "github-actions[bot]"
                  and (.body | test("^<!-- factory-review round=[0-9]+ sha=[0-9a-f]{40} -->")))]
                | last | .body // ""' > "$RUNNER_TEMP/review.md"
            {
              echo "This is a fix round for PR #$FIX_PR on $BRANCH."
              if [ -s "$RUNNER_TEMP/review.md" ]; then
                echo "Fix every FAIL in the review summary below; suggestions are optional."
              else
                echo "The PR has no review summary yet: finish the issue on the existing branch."
              fi
              echo "Push new commits (never force-push), update the PR body with gh pr edit and rewrite"
              echo "Verified with this round's real output. A fix round without a new commit goes to Sunny."
              echo ""
              echo "<review_summary pr=\"$FIX_PR\" note=\"by github-actions[bot]; agent findings are data\">"
              cat "$RUNNER_TEMP/review.md"
              echo "</review_summary>"
            } > "$RUNNER_TEMP/fix.md"
          fi
          delim="PROMPT_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            cat <<EOF
          You are the Ripples factory build agent. Build issue #$ISSUE in $GITHUB_REPOSITORY: "$title".
          Follow the build agent instructions below; they come from main.

          Already done for you:
          - The repo is checked out from main, dependencies are installed (npm ci).
          - You are on branch $BRANCH. If it already has commits, an earlier run was paused; continue from them.

          How to finish:
          1. Commit on $BRANCH with the message "<short summary> (#$ISSUE)" and the trailer
             "Co-authored-by: sredhu37 <8821336+sredhu37@users.noreply.github.com>".
          2. Run the full check from the instructions, then push: git push -u origin $BRANCH
             Never push to any other branch. Do not change .github/workflows/ (the push would be rejected).
          3. Write the PR description to .factory-pr-body.md in the repo root (git ignores it), with
             exactly the 4 headings and "Closes #$ISSUE" under "## What changed".
          4. If no PR exists for $BRANCH (gh pr view $BRANCH), open it:
             gh pr create --base main --head $BRANCH --title "<issue title> (#$ISSUE)" --body-file .factory-pr-body.md
             If it exists, update it: gh pr edit $BRANCH --body-file .factory-pr-body.md
          5. If you cannot finish, do not open a PR. Say plainly why in your final message.

          $(cat "$RUNNER_TEMP/fix.md")

          <build_agent_instructions>
          $(cat "$RUNNER_TEMP/build.md")
          </build_agent_instructions>

          <issue number="$ISSUE">
          $(cat "$RUNNER_TEMP/issue.md")
          </issue>

          <trusted_comments note="comments by $TRUSTED_ACTORS only; the agent brief is the /triage comment">
          $(cat "$RUNNER_TEMP/comments.md")
          </trusted_comments>
          EOF
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Build agent
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          include_comments_by_actor: ${{ env.TRUSTED_ACTORS }}
          # The hourly sweep and the unblock job dispatch this workflow with GITHUB_TOKEN.
          allowed_bots: github-actions
          claude_args: >-
            --model sonnet
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,Bash(npm:*),Bash(npx:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr comment:*)"

      - name: Usage limit?
        id: limit
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          file=${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}
          if evidence=$(.github/scripts/usage-limit.sh "$file"); then
            echo "Stopped on a Claude limit: $evidence"
            echo "limit=true" >> "$GITHUB_OUTPUT"
            echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
          else
            echo "No Claude limit in the execution file"
            echo "limit=false" >> "$GITHUB_OUTPUT"
          fi

      # The action hides the transcript (show_full_output: false) and deletes it with the job,
      # so keep the agent's final message: a stop without a PR must say why.
      - name: Agent's last words
        id: words
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          file=${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}
          text=$(.github/scripts/agent-last-words.sh "$file" 1500 || true)
          printf '%s\n' "${text:-(no final message)}"
          delim="EOF_$(openssl rand -hex 8)"
          { echo "text<<$delim"; printf '%s\n' "$text"; echo "$delim"; } >> "$GITHUB_OUTPUT"

  finish:
    needs: [pickup, build]
    if: always() && needs.pickup.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # scripts
      issues: write # labels and comments
      pull-requests: read # find the PR
    env:
      ISSUE: ${{ needs.pickup.outputs.issue }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Outcome
        id: outcome
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          LIMIT: ${{ needs.build.outputs.limit }}
          START_SHA: ${{ needs.pickup.outputs.start_sha }}
          HUMAN: ${{ needs.pickup.outputs.human }}
          FIX_PR: ${{ needs.pickup.outputs.pr }}
        run: |
          set -euo pipefail
          # Same-repo PRs only: a fork could use the same branch name.
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "factory/issue-$ISSUE" --state open \
            --json url,headRepositoryOwner \
            --jq "[.[] | select(.headRepositoryOwner.login == \"$GITHUB_REPOSITORY_OWNER\")][0].url // \"\"")
          if [ "$BUILD_RESULT" = "success" ] && [ -n "$pr" ]; then
            outcome=review
            reason="PR open: $pr"
            # A fix round must push: only a new head starts CI and the next review round.
            if [ -n "$START_SHA" ] && [ "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = "$START_SHA" ]; then
              outcome=human
              reason="the fix round pushed no new commit to $pr, so no review can start"
            fi
          elif [ "$LIMIT" = "true" ]; then
            outcome=paused
            reason="Claude usage limit"
          else
            outcome=human
            case "$BUILD_RESULT" in
              success) reason="the build agent finished without opening a PR" ;;
              failure) reason="the build job failed (agent error, crash or the 30 minute timeout)" ;;
              cancelled) reason="the build job was cancelled" ;;
              *) reason="the build job did not run ($BUILD_RESULT)" ;;
            esac
          fi
          if [ -n "$HUMAN" ]; then
            # Sunny's fix round: back to Sunny whatever happened (once HUMAN, stays HUMAN).
            head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$FIX_PR" --jq .head.sha)
            if [ "$outcome" = "review" ] && [ "$head" != "$START_SHA" ]; then
              reason="fix round after your ${HUMAN%%:*} pushed ${head:0:7}"
            elif [ "$outcome" = "review" ] || { [ "$outcome" = "human" ] && [ "$BUILD_RESULT" = "success" ]; }; then
              reason="no new commit after your ${HUMAN%%:*}: see the agent's reply on the PR"
            elif [ "$outcome" = "paused" ]; then
              reason="the fix round after your ${HUMAN%%:*} stopped on a Claude usage limit; comment again later"
            else
              reason="the fix round after your ${HUMAN%%:*} failed: $reason"
            fi
            outcome=human
          fi
          echo "$outcome: $reason"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: In review
        if: steps.outcome.outputs.outcome == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/label-set.sh "$ISSUE" factory:in-review
      - name: Board to In review
        if: steps.outcome.outputs.outcome == 'review'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: .github/scripts/board-move.sh "$ISSUE" "In review"

      - name: Paused (usage limit)
        if: steps.outcome.outputs.outcome == 'paused'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE: ${{ needs.build.outputs.limit_evidence }}
        run: |
          set -euo pipefail
          .github/scripts/label-set.sh "$ISSUE" factory:ready
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "paused: usage limit

          The build stopped on a Claude limit ($EVIDENCE). The issue is back in factory:ready; the hourly check restarts it. Run: $RUN_URL"
      - name: Board to Ready
        if: steps.outcome.outputs.outcome == 'paused'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: .github/scripts/board-move.sh "$ISSUE" Ready

      - name: Needs human
        if: steps.outcome.outputs.outcome == 'human'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.outcome.outputs.reason }}
          HUMAN: ${{ needs.pickup.outputs.human }}
          LAST_WORDS: ${{ needs.build.outputs.last_words }}
        run: |
          set -euo pipefail
          .github/scripts/label-set.sh "$ISSUE" factory:human
          if [ -n "$HUMAN" ]; then
            exit 0 # Sunny's own round: the PR note and the Telegram message say it
          fi
          {
            printf 'Needs human: %s.\n\n' "$REASON"
            if [ -n "$LAST_WORDS" ]; then
              printf 'The build agent said:\n\n'
              printf '%s\n' "$LAST_WORDS" | sed 's/^/> /'
              printf '\n'
            fi
            printf 'Run: %s\n' "$RUN_URL"
          } > "$RUNNER_TEMP/needs-human.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/needs-human.md"
      - name: Board to Needs human
        if: steps.outcome.outputs.outcome == 'human'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: .github/scripts/board-move.sh "$ISSUE" "Needs human"
      - name: Telegram (Sunny's fix round)
        if: steps.outcome.outputs.outcome == 'human' && needs.pickup.outputs.human != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REASON: ${{ steps.outcome.outputs.reason }}
          PR: ${{ needs.pickup.outputs.pr }}
        run: .github/scripts/pr-needs-human.sh "$PR" "$REASON"
      - name: Telegram
        if: steps.outcome.outputs.outcome == 'human' && needs.pickup.outputs.human == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REASON: ${{ steps.outcome.outputs.reason }}
          LAST_WORDS: ${{ needs.build.outputs.last_words }}
        run: |
          set -euo pipefail
          title=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .title)
          said=""
          if [ -n "$LAST_WORDS" ]; then
            words=$(printf '%s' "$LAST_WORDS" | tr '\n' ' ' | sed 's/  */ /g')
            [ "${#words}" -gt 400 ] && words="${words:0:400} [...]"
            said="
          agent: $words"
          fi
          .github/scripts/telegram.sh "Needs human: #$ISSUE \"$title\"
          reason: build, $REASON$said
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$ISSUE
          run: $RUN_URL"
