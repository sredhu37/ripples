name: factory-build
run-name: "factory-build issue #${{ inputs.issue }}${{ inputs.pr && format(' fix PR #{0}', inputs.pr) || '' }}"

# map-does: Build agent. Builds one issue the scan (or Sunny's PR comment) hands it, opens or updates the PR; also runs fix rounds.
# map-next: `pr-checks.yml` (the PR it pushes)

# The factory's build station. Spec: docs/factory.md, sections Build, Scan, Engine,
# Identity secrets and permissions, Labels and board.
#
#   workflow_dispatch with issue (the hourly scan, "Run now", or by hand)
#     pickup:  the issue is factory:ready (start), factory:in-progress (a stopped build: continue)
#              or factory:in-review without an open PR; skip if any blocker is open;
#              label factory:in-progress, board In progress
#     build:   claude-code-action, prompt .github/prompts/build.md + .claude/agents/build.md from main; branch factory/issue-<n>; opens the PR
#     finish:  PR open -> factory:in-review, board In review
#              usage limit -> factory:ready + "paused: usage limit" comment, board Ready
#              build job failed or timed out -> label stays, "stopped" comment with the agent's last
#                words; the scan continues it (max 3)
#              the agent finished without a PR, or a fix round pushed nothing -> factory:human +
#                comment, board Needs human, Slack
#   workflow_dispatch with pr (a fix round: factory-review after a FAIL, or the scan for a red check)
#     pickup:  the issue keeps factory:in-review; the PR must be its open factory/issue-<n> PR
#     build:   same branch and PR; the prompt adds the latest review summary and any red checks
#     A factory:ready issue whose branch already has an open PR (a paused fix round) runs as a fix round.
#   workflow_dispatch with pr and human (Sunny's comment on a PR in Needs human, dispatched by factory-gate.yml)
#     pickup:  the issue keeps factory:human (or factory:in-review, for a comment with @build); human is review:<id> or comment:<id> by sredhu37 on the PR
#     build:   same branch and PR; the prompt adds Sunny's comment: a question gets a reply, a change a commit
#     finish:  always back to factory:human, board Needs human, Slack (once HUMAN, stays HUMAN);
#              no review round runs and none is counted
#
# The run name carries the issue: the scan counts a ticket's active runs as one slot.
#
# Tokens: GITHUB_TOKEN for labels and comments. FACTORY_TOKEN only for board moves, in jobs that
# run no agent. The build agent pushes and opens the PR as the Claude GitHub App (OIDC, id-token: write).

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to build (factory:ready or factory:in-progress; factory:in-review with pr)
        required: true
        type: string
      pr:
        description: Fix round (factory-review sets it). The issue's open factory PR; the agent fixes every FAIL in its latest review summary
        required: false
        type: string
        default: ""
      human:
        description: Fix round from Sunny's comment (factory-gate sets it). review:<id> or comment:<id> by sredhu37 on pr; the issue keeps factory:human
        required: false
        type: string
        default: ""

# One run per issue at a time; the scan caps how many issues run (MAX_PARALLEL).
concurrency:
  group: factory-build-${{ inputs.issue }}
  queue: max
  cancel-in-progress: false

permissions: {}

env:
  TRUSTED_ACTORS: sredhu37,sredhu37-bot,claude[bot],github-actions[bot]

jobs:
  pickup:
    runs-on: ubuntu-latest
    environment: factory
    permissions:
      contents: read # scripts
      issues: write # label swap
    outputs:
      go: ${{ steps.check.outputs.go }}
      issue: ${{ steps.check.outputs.issue }}
      pr: ${{ steps.check.outputs.pr }}
      start_sha: ${{ steps.check.outputs.start_sha }}
      human: ${{ steps.check.outputs.human }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Ready (or a fix round), open and unblocked?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          FIX_PR: ${{ inputs.pr }}
          HUMAN: ${{ inputs.human }}
        run: .github/scripts/build/check.sh
      - name: In progress (label and board)
        if: steps.check.outputs.go == 'true' && steps.check.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          ISSUE: ${{ steps.check.outputs.issue }}
        run: .github/scripts/shared/move.sh "$ISSUE" factory:in-progress

  build:
    needs: pickup
    if: needs.pickup.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: factory
    permissions:
      contents: read # checkout; the agent pushes with the Claude App token, not this one
      issues: read # issue text and trusted comments for the prompt
      checks: read # red checks of a fix round's PR head, for the prompt
      pull-requests: read # the fix round's PR head
      id-token: write # claude-code-action exchanges OIDC for the Claude App token
    outputs:
      limit: ${{ steps.limit.outputs.limit }}
      limit_evidence: ${{ steps.limit.outputs.evidence }}
      last_words: ${{ steps.words.outputs.text }}
      has_workflow_patches: ${{ steps.workflow-patches.outputs.has_patches }}
    env:
      ISSUE: ${{ needs.pickup.outputs.issue }}
      BRANCH: factory/issue-${{ needs.pickup.outputs.issue }}
      FIX_PR: ${{ needs.pickup.outputs.pr }}
      HUMAN: ${{ needs.pickup.outputs.human }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm run install:all

      # Before the branch switch, so the script and the templates come from main.
      - name: Prompt (template and build.md from main, issue, trusted comments)
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/build/prompt.sh

      - name: Branch factory/issue-<n> (continues a paused run's branch if it exists)
        run: .github/scripts/build/branch.sh

      - name: Build agent
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          include_comments_by_actor: ${{ env.TRUSTED_ACTORS }}
          # The scan, factory-review and factory-gate dispatch this workflow with GITHUB_TOKEN.
          allowed_bots: github-actions
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,Bash(npm:*),Bash(npx:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr comment:*)"

      - name: Usage limit?
        id: limit
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: .github/scripts/build/limit.sh

      # The action hides the transcript (show_full_output: false) and deletes it with the job,
      # so keep the agent's final message: a stop without a PR must say why.
      - name: Agent's last words
        id: words
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: .github/scripts/build/last-words.sh

      - name: Check for unpushed workflow commits
        id: workflow-patches
        if: always()
        run: .github/scripts/build/workflow-patches.sh

      - name: Upload workflow patches artifact
        if: always() && steps.workflow-patches.outputs.has_patches == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: workflow-patches-${{ needs.pickup.outputs.issue }}
          path: ${{ runner.temp }}/workflow-patches/*.patch
          retention-days: 1

  push-workflows:
    name: push-workflows
    needs: [pickup, build]
    if: needs.build.outputs.has_workflow_patches == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: factory
    permissions:
      contents: write
    env:
      BRANCH: factory/issue-${{ needs.pickup.outputs.issue }}
      ISSUE: ${{ needs.pickup.outputs.issue }}
    steps:
      # Scripts from main: the PR branch is checked out below, in its own folder.
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github/scripts
          path: main
          persist-credentials: false

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: factory/issue-${{ needs.pickup.outputs.issue }}
          path: branch
          token: ${{ secrets.FACTORY_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Disable git hooks
        run: git config --global core.hooksPath /dev/null

      - name: Download workflow patches
        uses: actions/download-artifact@v4
        with:
          name: workflow-patches-${{ needs.pickup.outputs.issue }}
          path: ${{ runner.temp }}/workflow-patches

      - name: Apply patches and push
        working-directory: branch
        run: ../main/.github/scripts/build/push-workflows.sh

  finish:
    needs: [pickup, build, push-workflows]
    if: always() && needs.pickup.outputs.go == 'true'
    environment: factory
    runs-on: ubuntu-latest
    permissions:
      contents: read # scripts
      issues: write # labels and comments
      pull-requests: read # find the PR
    env:
      ISSUE: ${{ needs.pickup.outputs.issue }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Outcome
        id: outcome
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PUSH_RESULT: ${{ needs.push-workflows.result }}
          LIMIT: ${{ needs.build.outputs.limit }}
          START_SHA: ${{ needs.pickup.outputs.start_sha }}
          HUMAN: ${{ needs.pickup.outputs.human }}
          FIX_PR: ${{ needs.pickup.outputs.pr }}
        run: .github/scripts/build/outcome.sh

      - name: In review (label and board)
        if: steps.outcome.outputs.outcome == 'review'
        env:
          BOARD_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: .github/scripts/shared/move.sh "$ISSUE" factory:in-review

      - name: Paused (usage limit)
        if: steps.outcome.outputs.outcome == 'paused'
        env:
          BOARD_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          EVIDENCE: ${{ needs.build.outputs.limit_evidence }}
        run: .github/scripts/build/paused.sh

      - name: Stopped (the scan continues it)
        if: steps.outcome.outputs.outcome == 'stopped'
        env:
          REASON: ${{ steps.outcome.outputs.reason }}
          LAST_WORDS: ${{ needs.build.outputs.last_words }}
        run: .github/scripts/build/stopped.sh

      - name: Needs human
        if: steps.outcome.outputs.outcome == 'human'
        env:
          BOARD_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          REASON: ${{ steps.outcome.outputs.reason }}
          HUMAN: ${{ needs.pickup.outputs.human }}
          LAST_WORDS: ${{ needs.build.outputs.last_words }}
        run: .github/scripts/build/needs-human.sh
      - name: Slack (Sunny's fix round)
        if: steps.outcome.outputs.outcome == 'human' && needs.pickup.outputs.human != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REASON: ${{ steps.outcome.outputs.reason }}
          PR: ${{ needs.pickup.outputs.pr }}
        run: .github/scripts/shared/pr-needs-human.sh "$PR" "$REASON"
      - name: Slack
        if: steps.outcome.outputs.outcome == 'human' && needs.pickup.outputs.human == ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REASON: ${{ steps.outcome.outputs.reason }}
          LAST_WORDS: ${{ needs.build.outputs.last_words }}
        run: .github/scripts/build/slack.sh
