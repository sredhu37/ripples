<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
<title id="t">Parent login</title>
<desc id="d">The parent enters an email. The API stores a hashed 6-digit code and emails it through Resend. The parent types the code, the API checks it, creates the user and family on the first login, and answers with a 90-day session cookie.</desc>
<style>
svg{--bg:#f3fafb;--card:#ffffff;--line:#c4d6da;--grid:#d6e7ea;--ink:#1f343b;--mute:#587078;
--teal:#168195;--teal-soft:#d9eff2;--orange:#d96f12;--orange-soft:#fde9d6;--green:#3a9047;--green-soft:#dff2e1;
--red:#d23f3f;--on:#ffffff;--water:#cfe9ed;--shadow:#1f343b14}
@media (prefers-color-scheme: dark){svg{--bg:#0d1d23;--card:#14292f;--line:#2b4a54;--grid:#16303a;--ink:#e9f5f6;--mute:#93b4bc;
--teal:#47c6d8;--teal-soft:#17414b;--orange:#ffa14f;--orange-soft:#3d2b18;--green:#6fcb7d;--green-soft:#173a20;
--red:#ff7070;--on:#0d1d23;--water:#173f49;--shadow:#00000040}}
text{font-family:ui-rounded,'SF Pro Rounded',Nunito,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.bg{fill:var(--bg)}
.gdot{fill:var(--grid)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.shadow{fill:var(--shadow)}
.k-human{--c:var(--orange);--cs:var(--orange-soft)}
.k-flow{--c:var(--teal);--cs:var(--teal-soft)}
.k-done{--c:var(--green);--cs:var(--green-soft)}
.k-bad{--c:var(--red);--cs:var(--red)}
.edge{stroke:var(--c)}
.halo{fill:none;stroke:var(--c);stroke-width:3.5;opacity:0}
.nb{fill:var(--c)}
.nt{font-size:13px;font-weight:800;fill:var(--on);text-anchor:middle}
.pill{fill:var(--cs)}
.pt{font-size:10.5px;font-weight:600;fill:var(--c);font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.t-title{font-size:28px;font-weight:800}
.t-sub{font-size:14px;fill:var(--mute)}
.t-h{font-size:15px;font-weight:700}
.t-b{font-size:12px;fill:var(--mute)}
.t-m{font-size:11px;fill:var(--mute);font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.t-lbl{font-size:11px;font-weight:700}
.t-red{fill:var(--red)}
.t-green{fill:var(--green)}
.t-orange{fill:var(--orange)}
.t-teal{fill:var(--teal)}
.mid{text-anchor:middle}
.rail{stroke:var(--line);stroke-width:2.5;fill:none}
.link{stroke:var(--teal);stroke-width:2;fill:none}
.fail{stroke:var(--red);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:march 1s linear infinite}
.lblbg{fill:var(--bg)}
.dot-glow{fill:var(--dc);opacity:.28}
.dot-core{fill:var(--dc)}
.d-teal{--dc:var(--teal)}
.d-green{--dc:var(--green)}
.d-orange{--dc:var(--orange)}
.d-red{--dc:var(--red)}
.glyph{fill:var(--on)}
.glyph-s{stroke:var(--on);fill:none;stroke-width:2.5;stroke-linecap:round}
@keyframes march{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion: reduce){
  .dot{display:none}
  .halo,.fail,.float,.ring,.bob,.eyes{animation:none!important}
  .ring{opacity:0}
}

.k-mute{--c:var(--mute);--cs:var(--line)}
.zone{fill:var(--card);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 6}
.life{stroke:var(--line);stroke-width:2;stroke-dasharray:3 7;fill:none}
.row{font-size:11.5px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.rowk{font-size:11.5px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--mute)}
.thin{stroke:var(--mute);stroke-width:1.5;fill:none;stroke-dasharray:3 4}
@keyframes ha{0.00%{opacity:0.0}0.00%{opacity:0.0}3.00%{opacity:1.0}10.00%{opacity:0.0}85.00%{opacity:0.0}88.00%{opacity:1.0}95.00%{opacity:0.0}100.00%{opacity:0.0}}.ha{animation:ha 13s linear infinite}@keyframes hb{0.00%{opacity:0.0}10.00%{opacity:0.0}13.00%{opacity:1.0}20.00%{opacity:0.0}55.00%{opacity:0.0}58.00%{opacity:1.0}65.00%{opacity:0.0}100.00%{opacity:0.0}}.hb{animation:hb 13s linear infinite}@keyframes hp{0.00%{opacity:0.0}25.00%{opacity:0.0}28.00%{opacity:1.0}35.00%{opacity:0.0}70.00%{opacity:0.0}73.00%{opacity:1.0}80.00%{opacity:0.0}100.00%{opacity:0.0}}.hp{animation:hp 13s linear infinite}@keyframes hr{0.00%{opacity:0.0}40.00%{opacity:0.0}43.00%{opacity:1.0}50.00%{opacity:0.0}100.00%{opacity:0.0}}.hr{animation:hr 13s linear infinite}</style>
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" class="gdot"/></pattern><marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" style="stroke:var(--teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" style="stroke:var(--red)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" style="stroke:var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" style="stroke:var(--orange)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" style="stroke:var(--line)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" style="stroke:var(--mute)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="1200" height="660" rx="24"/>
<rect width="1200" height="660" rx="24" fill="url(#g)"/>
<text class="t-title" x="40" y="48">Parent login</text>
<text class="t-sub" x="40" y="72">Email, then a 6-digit code. No password. The first login also creates the family.</text>
<path class="life" d="M140 176 V636"/>
<path class="life" d="M450 176 V636"/>
<path class="life" d="M760 176 V636"/>
<path class="life" d="M1060 176 V636"/>
<g class="k-flow">
<rect class="shadow" x="40.0" y="104" width="200" height="70" rx="16"/>
<rect class="halo ha" x="36.0" y="96" width="208" height="78" rx="20"/>
<rect class="card edge" x="40.0" y="100" width="200" height="70" rx="16"/>
<text class="t-h" x="56.0" y="132">Parent's browser</text>
<text class="t-m" x="56.0" y="154">LoginScreen.tsx</text>
</g>
<g class="k-flow">
<rect class="shadow" x="350.0" y="104" width="200" height="70" rx="16"/>
<rect class="halo hb" x="346.0" y="96" width="208" height="78" rx="20"/>
<rect class="card edge" x="350.0" y="100" width="200" height="70" rx="16"/>
<text class="t-h" x="366.0" y="132">Node API</text>
<text class="t-m" x="366.0" y="154">Better Auth, Email OTP</text>
</g>
<g class="k-flow">
<rect class="shadow" x="660.0" y="104" width="200" height="70" rx="16"/>
<rect class="halo hp" x="656.0" y="96" width="208" height="78" rx="20"/>
<rect class="card edge" x="660.0" y="100" width="200" height="70" rx="16"/>
<text class="t-h" x="676.0" y="132">Postgres</text>
<text class="t-m" x="676.0" y="154">user, verification, family</text>
</g>
<g class="k-human">
<rect class="shadow" x="960.0" y="104" width="200" height="70" rx="16"/>
<rect class="halo hr" x="956.0" y="96" width="208" height="78" rx="20"/>
<rect class="card edge" x="960.0" y="100" width="200" height="70" rx="16"/>
<text class="t-h" x="976.0" y="132">Resend</text>
<text class="t-m" x="976.0" y="154">email API</text>
</g>
<rect class="zone" x="520" y="418" width="640" height="56" rx="14"/>
<text class="t-b" x="538" y="440">Limits, per client address: 3 sends and 3 checks per minute.</text>
<text class="t-b" x="538" y="458">3 wrong guesses burn the code (counted in the database).</text>
<path d="M144 245 H444" style="stroke:var(--teal)" stroke-width="2.5" fill="none" marker-end="url(#ah-teal)"/>
<rect class="lblbg" x="247" y="218" width="96" height="22" rx="11"/><text class="t-lbl mid" x="295.0" y="233">email address</text>
<circle cx="164" cy="245" r="11.5" style="fill:var(--teal)"/><text class="nt" x="164" y="249.5">1</text>
<path d="M454 311 H754" style="stroke:var(--teal)" stroke-width="2.5" fill="none" marker-end="url(#ah-teal)"/>
<rect class="lblbg" x="492" y="284" width="225" height="22" rx="11"/><text class="t-lbl mid" x="605.0" y="299">store the code (hashed, 5 minutes)</text>
<circle cx="474" cy="311" r="11.5" style="fill:var(--teal)"/><text class="nt" x="474" y="315.5">2</text>
<path d="M454 377 H1054" style="stroke:var(--orange)" stroke-width="2.5" fill="none" marker-end="url(#ah-orange)"/>
<rect class="lblbg" x="679" y="350" width="152" height="22" rx="11"/><text class="t-lbl mid" x="755.0" y="365">email the 6-digit code</text>
<circle cx="474" cy="377" r="11.5" style="fill:var(--orange)"/><text class="nt" x="474" y="381.5">3</text>
<text class="t-m mid" x="755.0" y="397">no RESEND_API_KEY: written to the API log instead</text>
<path d="M144 455 H444" style="stroke:var(--teal)" stroke-width="2.5" fill="none" marker-end="url(#ah-teal)"/>
<rect class="lblbg" x="250" y="428" width="90" height="22" rx="11"/><text class="t-lbl mid" x="295.0" y="443">6-digit code</text>
<circle cx="164" cy="455" r="11.5" style="fill:var(--teal)"/><text class="nt" x="164" y="459.5">4</text>
<path d="M454 521 H754" style="stroke:var(--teal)" stroke-width="2.5" fill="none" marker-end="url(#ah-teal)"/>
<rect class="lblbg" x="502" y="494" width="207" height="22" rx="11"/><text class="t-lbl mid" x="605.0" y="509">check code, add user and family</text>
<circle cx="474" cy="521" r="11.5" style="fill:var(--teal)"/><text class="nt" x="474" y="525.5">5</text>
<path d="M446 587 H146" style="stroke:var(--green)" stroke-width="2.5" fill="none" marker-end="url(#ah-green)"/>
<rect class="lblbg" x="244" y="560" width="102" height="22" rx="11"/><text class="t-lbl mid" x="295.0" y="575">session cookie</text>
<circle cx="426" cy="587" r="11.5" style="fill:var(--green)"/><text class="nt" x="426" y="591.5">6</text>
<text class="t-m mid" x="295.0" y="607">httpOnly, 90 days</text>
<g class="dot d-teal" opacity="0"><circle r="10.8" class="dot-glow"/><circle r="4.5" class="dot-core"/><animateMotion dur="13s" repeatCount="indefinite" path="M144 245 H444" keyPoints="0;0;1;1" keyTimes="0;0.030;0.140;1" calcMode="linear"/><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.030;0.040;0.130;0.140;1"/></g>
<g class="dot d-teal" opacity="0"><circle r="10.8" class="dot-glow"/><circle r="4.5" class="dot-core"/><animateMotion dur="13s" repeatCount="indefinite" path="M454 311 H754" keyPoints="0;0;1;1" keyTimes="0;0.180;0.290;1" calcMode="linear"/><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.180;0.190;0.280;0.290;1"/></g>
<g class="dot d-orange" opacity="0"><circle r="10.8" class="dot-glow"/><circle r="4.5" class="dot-core"/><animateMotion dur="13s" repeatCount="indefinite" path="M454 377 H1054" keyPoints="0;0;1;1" keyTimes="0;0.330;0.440;1" calcMode="linear"/><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.330;0.340;0.430;0.440;1"/></g>
<g class="dot d-teal" opacity="0"><circle r="10.8" class="dot-glow"/><circle r="4.5" class="dot-core"/><animateMotion dur="13s" repeatCount="indefinite" path="M144 455 H444" keyPoints="0;0;1;1" keyTimes="0;0.480;0.590;1" calcMode="linear"/><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.480;0.490;0.580;0.590;1"/></g>
<g class="dot d-teal" opacity="0"><circle r="10.8" class="dot-glow"/><circle r="4.5" class="dot-core"/><animateMotion dur="13s" repeatCount="indefinite" path="M454 521 H754" keyPoints="0;0;1;1" keyTimes="0;0.630;0.740;1" calcMode="linear"/><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.630;0.640;0.730;0.740;1"/></g>
<g class="dot d-green" opacity="0"><circle r="10.8" class="dot-glow"/><circle r="4.5" class="dot-core"/><animateMotion dur="13s" repeatCount="indefinite" path="M446 587 H146" keyPoints="0;0;1;1" keyTimes="0;0.780;0.890;1" calcMode="linear"/><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.780;0.790;0.880;0.890;1"/></g>
</svg>
