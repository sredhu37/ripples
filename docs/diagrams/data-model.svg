<g class="dot d-red" opacity="0"><circle r="10.8" class="dot-glow"/><circle r="4.5" class="dot-core"/><animateMotion dur="10s" repeatCount="indefinite" path="M738 178 H672" keyPoints="0;0;1;1" keyTimes="0;0.220;0.290;1" calcMode="linear"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.220;0.230;0.280;0.290;1"/></g>
