<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-labelledby="t d">
<title id="t">Data model</title>
<desc id="d">Better Auth tables on the left (user, session, account, verification). Ripples tables on the right: family belongs to a user, kid_profile and subscription belong to a family. Every link is ON DELETE CASCADE, so deleting the parent account erases the family.</desc>
<style>
svg{--bg:#f3fafb;--card:#ffffff;--line:#c4d6da;--grid:#d6e7ea;--ink:#1f343b;--mute:#587078;
--teal:#168195;--teal-soft:#d9eff2;--orange:#d96f12;--orange-soft:#fde9d6;--green:#3a9047;--green-soft:#dff2e1;
--red:#d23f3f;--on:#ffffff;--water:#cfe9ed;--shadow:#1f343b14}
@media (prefers-color-scheme: dark){svg{--bg:#0d1d23;--card:#14292f;--line:#2b4a54;--grid:#16303a;--ink:#e9f5f6;--mute:#93b4bc;
--teal:#47c6d8;--teal-soft:#17414b;--orange:#ffa14f;--orange-soft:#3d2b18;--green:#6fcb7d;--green-soft:#173a20;
--red:#ff7070;--on:#0d1d23;--water:#173f49;--shadow:#00000040}}
text{font-family:ui-rounded,'SF Pro Rounded',Nunito,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.bg{fill:var(--bg)}
.gdot{fill:var(--grid)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.shadow{fill:var(--shadow)}
.k-human{--c:var(--orange);--cs:var(--orange-soft)}
.k-flow{--c:var(--teal);--cs:var(--teal-soft)}
.k-done{--c:var(--green);--cs:var(--green-soft)}
.k-bad{--c:var(--red);--cs:var(--red)}
.edge{stroke:var(--c)}
.halo{fill:none;stroke:var(--c);stroke-width:3.5;opacity:0}
.nb{fill:var(--c)}
.nt{font-size:13px;font-weight:800;fill:var(--on);text-anchor:middle}
.pill{fill:var(--cs)}
.pt{font-size:10.5px;font-weight:600;fill:var(--c);font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.t-title{font-size:28px;font-weight:800}
.t-sub{font-size:14px;fill:var(--mute)}
.t-h{font-size:15px;font-weight:700}
.t-b{font-size:12px;fill:var(--mute)}
.t-m{font-size:11px;fill:var(--mute);font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.t-lbl{font-size:11px;font-weight:700}
.t-red{fill:var(--red)}
.t-green{fill:var(--green)}
.t-orange{fill:var(--orange)}
.t-teal{fill:var(--teal)}
.mid{text-anchor:middle}
.rail{stroke:var(--line);stroke-width:2.5;fill:none}
.link{stroke:var(--teal);stroke-width:2;fill:none}
.fail{stroke:var(--red);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:march 1s linear infinite}
.lblbg{fill:var(--bg)}
.dot-glow{fill:var(--dc);opacity:.28}
.dot-core{fill:var(--dc)}
.d-teal{--dc:var(--teal)}
.d-green{--dc:var(--green)}
.d-orange{--dc:var(--orange)}
.d-red{--dc:var(--red)}
.glyph{fill:var(--on)}
.glyph-s{stroke:var(--on);fill:none;stroke-width:2.5;stroke-linecap:round}
@keyframes march{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion: reduce){
  .dot{display:none}
  .halo,.fail,.float,.ring,.bob,.eyes{animation:none!important}
  .ring{opacity:0}
}

.k-mute{--c:var(--mute);--cs:var(--line)}
.zone{fill:var(--card);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 6}
.life{stroke:var(--line);stroke-width:2;stroke-dasharray:3 7;fill:none}
.row{font-size:11.5px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.rowk{font-size:11.5px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--mute)}
.thin{stroke:var(--mute);stroke-width:1.5;fill:none;stroke-dasharray:3 4}
@keyframes hu{0.00%{opacity:0.0}4.00%{opacity:0.0}7.00%{opacity:1.0}16.00%{opacity:0.0}100.00%{opacity:0.0}}.hu{animation:hu 10s linear infinite}@keyframes hs{0.00%{opacity:0.0}17.00%{opacity:0.0}20.00%{opacity:1.0}29.00%{opacity:0.0}100.00%{opacity:0.0}}.hs{animation:hs 10s linear infinite}@keyframes hc{0.00%{opacity:0.0}21.00%{opacity:0.0}24.00%{opacity:1.0}33.00%{opacity:0.0}100.00%{opacity:0.0}}.hc{animation:hc 10s linear infinite}@keyframes hf{0.00%{opacity:0.0}29.00%{opacity:0.0}32.00%{opacity:1.0}41.00%{opacity:0.0}100.00%{opacity:0.0}}.hf{animation:hf 10s linear infinite}@keyframes hk{0.00%{opacity:0.0}43.00%{opacity:0.0}46.00%{opacity:1.0}55.00%{opacity:0.0}100.00%{opacity:0.0}}.hk{animation:hk 10s linear infinite}@keyframes hn{0.00%{opacity:0.0}43.00%{opacity:0.0}46.00%{opacity:1.0}55.00%{opacity:0.0}100.00%{opacity:0.0}}.hn{animation:hn 10s linear infinite}</style>
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" class="gdot"/></pattern><marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" style="stroke:var(--teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" style="stroke:var(--red)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" style="stroke:var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" style="stroke:var(--orange)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" style="stroke:var(--line)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" style="stroke:var(--mute)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="1200" height="610" rx="24"/>
<rect width="1200" height="610" rx="24" fill="url(#g)"/>
<text class="t-title" x="40" y="48">Data model</text>
<text class="t-sub" x="40" y="72">Delete a parent account and the whole family goes with it (GDPR erasure). Lessons stay in code.</text>
<text class="t-m" x="40" y="104" style="letter-spacing:.8px;font-weight:700">LOGIN LIBRARY (BETTER AUTH)</text>
<text class="t-m" x="400" y="104" style="letter-spacing:.8px;font-weight:700">PARENT</text>
<text class="t-m" x="740" y="104" style="letter-spacing:.8px;font-weight:700">RIPPLES</text>
<g class="k-flow">
<rect class="shadow" x="40" y="122" width="270" height="142" rx="14"/>
<rect class="halo hs" style="stroke:var(--red)" x="36" y="114" width="278" height="150" rx="18"/>
<rect class="card edge" x="40" y="118" width="270" height="142" rx="14"/>
<path d="M41 152 H309" style="stroke:var(--line)" stroke-width="1"/>
<text class="t-h" x="54" y="141" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">session</text>
<text class="row" x="54" y="171">id</text>
<text class="row" x="54" y="189">token (unique)</text>
<text class="row" x="54" y="207">expiresAt</text>
<text class="row" x="54" y="225">userId</text>
<text class="row" x="54" y="243">ipAddress, userAgent</text>
</g>
<g class="k-flow">
<rect class="shadow" x="40" y="278" width="270" height="142" rx="14"/>
<rect class="halo hc" style="stroke:var(--red)" x="36" y="270" width="278" height="150" rx="18"/>
<rect class="card edge" x="40" y="274" width="270" height="142" rx="14"/>
<path d="M41 308 H309" style="stroke:var(--line)" stroke-width="1"/>
<text class="t-h" x="54" y="297" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">account</text>
<text class="row" x="54" y="327">id</text>
<text class="row" x="54" y="345">accountId, providerId</text>
<text class="row" x="54" y="363">userId</text>
<text class="row" x="54" y="381">tokens, scope, password</text>
<text class="row" x="54" y="399">createdAt, updatedAt</text>
</g>
<g class="k-mute">
<rect class="shadow" x="40" y="434" width="270" height="124" rx="14"/>
<rect class="card edge" x="40" y="430" width="270" height="124" rx="14"/>
<path d="M41 464 H309" style="stroke:var(--line)" stroke-width="1"/>
<text class="t-h" x="54" y="453" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">verification</text>
<text class="row" x="54" y="483">id</text>
<text class="row" x="54" y="501">identifier (the email)</text>
<text class="row" x="54" y="519">value (the hashed code)</text>
<text class="row" x="54" y="537">expiresAt</text>
</g>
<g class="k-human">
<rect class="shadow" x="400" y="122" width="270" height="142" rx="14"/>
<rect class="halo hu" style="stroke:var(--red)" x="396" y="114" width="278" height="150" rx="18"/>
<rect class="card edge" x="400" y="118" width="270" height="142" rx="14"/>
<path d="M401 152 H669" style="stroke:var(--line)" stroke-width="1"/>
<text class="t-h" x="414" y="141" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">user</text>
<text class="row" x="414" y="171">id</text>
<text class="row" x="414" y="189">name, image</text>
<text class="row" x="414" y="207">email (unique)</text>
<text class="row" x="414" y="225">emailVerified</text>
<text class="row" x="414" y="243">createdAt, updatedAt</text>
</g>
<g class="k-done">
<rect class="shadow" x="740" y="122" width="420" height="124" rx="14"/>
<rect class="halo hf" style="stroke:var(--red)" x="736" y="114" width="428" height="132" rx="18"/>
<rect class="card edge" x="740" y="118" width="420" height="124" rx="14"/>
<path d="M741 152 H1159" style="stroke:var(--line)" stroke-width="1"/>
<text class="t-h" x="754" y="141" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">family</text>
<text class="row" x="754" y="171">id</text>
<text class="row" x="754" y="189">created_at</text>
<text class="row" x="754" y="207">free_month_ends_at (30 days after first login)</text>
<text class="row" x="754" y="225">parent_user_id (unique)</text>
</g>
<g class="k-done">
<rect class="shadow" x="740" y="304" width="205" height="214" rx="14"/>
<rect class="halo hk" style="stroke:var(--red)" x="736" y="296" width="213" height="222" rx="18"/>
<rect class="card edge" x="740" y="300" width="205" height="214" rx="14"/>
<path d="M741 334 H944" style="stroke:var(--line)" stroke-width="1"/>
<text class="t-h" x="754" y="323" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">kid_profile</text>
<text class="row" x="754" y="353">id</text>
<text class="row" x="754" y="371">family_id</text>
<text class="row" x="754" y="389">nickname (max 20)</text>
<text class="row" x="754" y="407">avatar</text>
<text class="row" x="754" y="425">lang (en, de, pl)</text>
<text class="row" x="754" y="443">muted</text>
<text class="row" x="754" y="461">badges (text[])</text>
<text class="row" x="754" y="479">disabled_lessons</text>
<text class="row" x="754" y="497">created_at</text>
</g>
<g class="k-done">
<rect class="shadow" x="955" y="304" width="205" height="160" rx="14"/>
<rect class="halo hn" style="stroke:var(--red)" x="951" y="296" width="213" height="168" rx="18"/>
<rect class="card edge" x="955" y="300" width="205" height="160" rx="14"/>
<path d="M956 334 H1159" style="stroke:var(--line)" stroke-width="1"/>
<text class="t-h" x="969" y="323" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">subscription</text>
<text class="row" x="969" y="353">family_id (primary key)</text>
<text class="row" x="969" y="371">provider (stripe)</text>
<text class="row" x="969" y="389">provider_customer_id</text>
<text class="row" x="969" y="407">provider_subscription_id</text>
<text class="row" x="969" y="425">status</text>
<text class="row" x="969" y="443">current_period_end</text>
</g>
<path d="M312 216 H398" style="stroke:var(--mute)" stroke-width="2.2" fill="none" marker-end="url(#ah-mute)"/>
<path d="M312 354 H355 V234 H398" style="stroke:var(--mute)" stroke-width="2.2" fill="none" marker-end="url(#ah-mute)"/>
<path d="M672 178 H738" style="stroke:var(--mute)" stroke-width="2.2" fill="none" marker-end="url(#ah-mute)"/>
<path d="M842 244 V298" style="stroke:var(--mute)" stroke-width="2.2" fill="none" marker-end="url(#ah-mute)"/>
<path d="M1057 244 V298" style="stroke:var(--mute)" stroke-width="2.2" fill="none" marker-end="url(#ah-mute)"/>
<rect class="lblbg" x="325" y="189" width="59" height="22" rx="11"/><text class="t-m mid" x="355" y="204">cascade</text>
<rect class="lblbg" x="675" y="143" width="59" height="22" rx="11"/><text class="t-m mid" x="705" y="158">cascade</text>
<rect class="lblbg" x="812" y="257" width="59" height="22" rx="11"/><text class="t-m mid" x="842" y="272">cascade</text>
<rect class="lblbg" x="1027" y="257" width="59" height="22" rx="11"/><text class="t-m mid" x="1057" y="272">cascade</text>
<rect class="zone" x="400" y="318" width="290" height="104" rx="14"/>
<text class="t-b" x="416" y="344">Arrows point to the parent row.</text>
<text class="t-b" x="416" y="362">Each link is ON DELETE CASCADE,</text>
<text class="t-b" x="416" y="380">so deleting a user erases its family.</text>
<text class="t-b" x="416" y="406">Red dots: a delete running down the chain.</text>
<text class="t-m" x="40" y="590">Better Auth tables are written by hand in server/db/migrations/ and checked by server/schema-probe.test.ts.</text>
<g class="dot d-red" opacity="0"><circle r="10.8" class="dot-glow"/><circle r="4.5" class="dot-core"/><animateMotion dur="10s" repeatCount="indefinite" path="M398 216 H312" keyPoints="0;0;1;1" keyTimes="0;0.080;0.170;1" calcMode="linear"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.080;0.090;0.160;0.170;1"/></g>
