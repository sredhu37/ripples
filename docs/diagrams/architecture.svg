<rect class="bg" width="1200" height="600" rx="24"/>
<rect width="1200" height="600" rx="24" fill="url(#g)"/>
<text class="t-title" x="29" y="48">Ripples architecture</text>
<text class="t-sub" x="29" y="72">One app, one API, one database. Lessons live in code; only what families create is stored.</text>
<rect class="zone" x="29" y="100" width="400" height="470" rx="22"/><text class="zt" x="49" y="126">ON THE DEVICE</text>
<rect class="zone" x="470" y="100" width="300" height="470" rx="22"/><text class="zt" x="490" y="126">API</text>
<rect class="zone" x="810" y="100" width="361" height="470" rx="22"/><text class="zt" x="830" y="126">DATA AND MAIL</text>
<g class="k-human"><rect class="shadow" x="59" y="144" width="340" height="58" rx="16"/><rect class="halo hc" x="55" y="136" width="348" height="66" rx="20"/><rect class="card edge" x="59" y="140" width="340" height="58" rx="16"/><text class="t-h" x="75" y="168">Child</text><text class="t-m" x="75" y="186">iPad, phone or Mac</text></g>
<g class="k-flow"><rect class="shadow" x="59" y="242" width="340" height="214" rx="16"/><rect class="halo ha" x="55" y="234" width="348" height="222" rx="20"/><rect class="card edge" x="59" y="238" width="340" height="214" rx="16"/><text class="t-h" x="75" y="266">React app</text><text class="t-m" x="75" y="284">web/  (React, TypeScript, Vite)</text></g>
<g class="k-flow"><rect class="chipbg" x="75" y="296" width="308" height="26" rx="8"/><text class="chiptn" x="85" y="313.5">Trail, lesson engine, badges</text></g>
<g class="k-flow"><rect class="chipbg" x="75" y="332" width="308" height="26" rx="8"/><text class="chiptn" x="85" y="349.5">Lessons in code: EN, DE, PL</text></g>
<g class="k-flow"><rect class="chipbg" x="75" y="368" width="308" height="26" rx="8"/><text class="chiptn" x="85" y="385.5">Family settings behind a maths gate</text></g>
<g class="k-flow"><rect class="chipbg" x="75" y="404" width="308" height="26" rx="8"/><text class="chiptn" x="85" y="421.5">Service worker: offline app files</text></g>
<g class="k-flow"><rect class="shadow" x="59" y="496" width="164" height="62" rx="16"/><rect class="card edge" x="59" y="492" width="164" height="62" rx="16"/><text class="t-h" x="75" y="520">Device voice</text><text class="t-m" x="75" y="538">Web Speech API</text></g>
<g class="k-flow"><rect class="shadow" x="235" y="496" width="164" height="62" rx="16"/><rect class="card edge" x="235" y="492" width="164" height="62" rx="16"/><text class="t-h" x="251" y="520">Browser storage</text><text class="t-m" x="251" y="538">ripples.lang key</text></g>
