<path d="M317 452 V490" stroke="var(--teal)" stroke-width="2.5" fill="none" marker-end="url(#ah-teal)"/>
<g class="k-flow"><rect class="shadow" x="500" y="144" width="240" height="340" rx="16"/><rect class="halo hb" x="496" y="136" width="248" height="348" rx="20"/><rect class="card edge" x="500" y="140" width="240" height="340" rx="16"/><text class="t-h" x="516" y="168">Node API</text><text class="t-m" x="516" y="186">server/  (Hono, TypeScript)</text></g>
<g class="k-flow"><rect class="chipbg" x="516" y="198" width="208" height="30" rx="8"/><text class="chipt" x="526" y="217" style="font-weight:600">/api/auth/*</text></g>
<g class="k-flow"><rect class="chipbg" x="516" y="234" width="208" height="30" rx="8"/><text class="chipt" x="526" y="253" style="font-weight:600">/api/family</text></g>
<g class="k-flow"><rect class="chipbg" x="516" y="270" width="208" height="30" rx="8"/><text class="chipt" x="526" y="289" style="font-weight:600">/api/profiles</text></g>
<g class="k-flow"><rect class="chipbg" x="516" y="306" width="208" height="30" rx="8"/><text class="chipt" x="526" y="325" style="font-weight:600">/api/features</text></g>
<g class="k-flow"><rect class="chipbg" x="516" y="342" width="208" height="30" rx="8"/><text class="chipt" x="526" y="361" style="font-weight:600">/api/legal</text></g>
<g class="k-flow"><rect class="chipbg" x="516" y="378" width="208" height="30" rx="8"/><text class="chipt" x="526" y="397" style="font-weight:600">/api/health</text></g>
<text class="t-b" x="516" y="428">Serves web/dist when</text>
<text class="t-b" x="516" y="444">DIST_DIR is set.</text>
<text class="t-b" x="516" y="466">Session cookie lasts 90 days.</text>
<g class="k-flow"><rect class="shadow" x="840" y="144" width="301" height="252" rx="16"/><rect class="halo hp" x="836" y="136" width="309" height="260" rx="20"/><rect class="card edge" x="840" y="140" width="301" height="252" rx="16"/><text class="t-h" x="856" y="168">Postgres 17</text><text class="t-m" x="856" y="186">compose.yaml or Neon</text></g>
<g class="k-flow"><rect class="chipbg" x="856" y="198" width="269" height="26" rx="8"/><text class="chipt" x="866" y="215.5">family</text></g>
<g class="k-flow"><rect class="chipbg" x="856" y="232" width="269" height="26" rx="8"/><text class="chipt" x="866" y="249.5">kid_profile</text></g>
<g class="k-flow"><rect class="chipbg" x="856" y="266" width="269" height="26" rx="8"/><text class="chipt" x="866" y="283.5">subscription</text></g>
<g class="k-flow"><rect class="chipbg" x="856" y="300" width="269" height="26" rx="8"/><text class="chipt" x="866" y="317.5">user, session, account</text></g>
<text class="t-b" x="856" y="360">Lessons stay in code, not here.</text>
<g class="k-human"><rect class="shadow" x="840" y="428" width="301" height="130" rx="16"/><rect class="halo hr" x="836" y="420" width="309" height="138" rx="20"/><rect class="card edge" x="840" y="424" width="301" height="130" rx="16"/><text class="t-h" x="856" y="452">Resend</text><text class="t-m" x="856" y="470">email API</text></g>
<text class="t-b" x="856" y="500">Emails the 6-digit login code.</text>
<text class="t-b" x="856" y="518">Self-host: printed in the API log.</text>
