<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">Ripples: how the real world works, explained to an 8-year-old</title>
<desc id="d">Banner with Otto the otter on a pond, the app name, a tagline, six topic groups, three languages and the lesson loop: story, toy, three questions, badge.</desc>
<style>
svg{--bg:#f3fafb;--card:#ffffff;--line:#c4d6da;--grid:#d6e7ea;--ink:#1f343b;--mute:#587078;
--teal:#168195;--teal-soft:#d9eff2;--orange:#d96f12;--orange-soft:#fde9d6;--green:#3a9047;--green-soft:#dff2e1;
--red:#d23f3f;--on:#ffffff;--water:#cfe9ed;--shadow:#1f343b14}
@media (prefers-color-scheme: dark){svg{--bg:#0d1d23;--card:#14292f;--line:#2b4a54;--grid:#16303a;--ink:#e9f5f6;--mute:#93b4bc;
--teal:#47c6d8;--teal-soft:#17414b;--orange:#ffa14f;--orange-soft:#3d2b18;--green:#6fcb7d;--green-soft:#173a20;
--red:#ff7070;--on:#0d1d23;--water:#173f49;--shadow:#00000040}}
text{font-family:ui-rounded,'SF Pro Rounded',Nunito,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.bg{fill:var(--bg)}
.gdot{fill:var(--grid)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.shadow{fill:var(--shadow)}
.k-human{--c:var(--orange);--cs:var(--orange-soft)}
.k-flow{--c:var(--teal);--cs:var(--teal-soft)}
.k-done{--c:var(--green);--cs:var(--green-soft)}
.k-bad{--c:var(--red);--cs:var(--red)}
.edge{stroke:var(--c)}
.halo{fill:none;stroke:var(--c);stroke-width:3.5;opacity:0}
.nb{fill:var(--c)}
.nt{font-size:13px;font-weight:800;fill:var(--on);text-anchor:middle}
.pill{fill:var(--cs)}
.pt{font-size:10.5px;font-weight:600;fill:var(--c);font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.t-title{font-size:28px;font-weight:800}
.t-sub{font-size:14px;fill:var(--mute)}
.t-h{font-size:15px;font-weight:700}
.t-b{font-size:12px;fill:var(--mute)}
.t-m{font-size:11px;fill:var(--mute);font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.t-lbl{font-size:11px;font-weight:700}
.t-red{fill:var(--red)}
.t-green{fill:var(--green)}
.t-orange{fill:var(--orange)}
.t-teal{fill:var(--teal)}
.mid{text-anchor:middle}
.rail{stroke:var(--line);stroke-width:2.5;fill:none}
.link{stroke:var(--teal);stroke-width:2;fill:none}
.fail{stroke:var(--red);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:march 1s linear infinite}
.lblbg{fill:var(--bg)}
.dot-glow{fill:var(--dc);opacity:.28}
.dot-core{fill:var(--dc)}
.d-teal{--dc:var(--teal)}
.d-green{--dc:var(--green)}
.d-orange{--dc:var(--orange)}
.d-red{--dc:var(--red)}
.glyph{fill:var(--on)}
.glyph-s{stroke:var(--on);fill:none;stroke-width:2.5;stroke-linecap:round}
@keyframes march{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion: reduce){
  .dot{display:none}
  .halo,.fail,.float,.ring,.bob,.eyes{animation:none!important}
  .ring{opacity:0}
}

.bob{animation:bob 3.4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.water{fill:var(--water)}
.ring{fill:none;stroke:var(--teal);stroke-width:2.5;transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 4.5s ease-out infinite}
@keyframes ring{0%{transform:scale(.25);opacity:.75}100%{transform:scale(1.15);opacity:0}}
.float{animation:float 5s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.name{font-size:92px;font-weight:800;letter-spacing:-2px}
.tag{font-size:24px;font-weight:700}
.sub{font-size:17px;fill:var(--mute)}
.chip{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.chiptxt{font-size:13px;font-weight:600}
.lang{fill:var(--teal-soft)}
.langtxt{font-size:13px;font-weight:700;fill:var(--teal)}
.sdot{fill:var(--teal)}
.ic{fill:var(--c)}
@keyframes hs0{0.00%{opacity:0.0}5.00%{opacity:0.0}9.00%{opacity:1.0}21.00%{opacity:0.0}100.00%{opacity:0.0}}.hs0{animation:hs0 9s linear infinite}@keyframes hs1{0.00%{opacity:0.0}26.33%{opacity:0.0}30.33%{opacity:1.0}42.33%{opacity:0.0}100.00%{opacity:0.0}}.hs1{animation:hs1 9s linear infinite}@keyframes hs2{0.00%{opacity:0.0}47.67%{opacity:0.0}51.67%{opacity:1.0}63.67%{opacity:0.0}100.00%{opacity:0.0}}.hs2{animation:hs2 9s linear infinite}@keyframes hs3{0.00%{opacity:0.0}69.00%{opacity:0.0}73.00%{opacity:1.0}85.00%{opacity:0.0}100.00%{opacity:0.0}}.hs3{animation:hs3 9s linear infinite}</style>
