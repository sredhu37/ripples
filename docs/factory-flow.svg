<rect class="halo hc2" x="413" y="186" width="180" height="168" rx="20"/>
<rect class="card edge" x="417" y="190" width="172" height="160" rx="16"/>
<circle class="nb" cx="441" cy="230" r="12"/><text class="nt" x="441" y="234.5">3</text>
<text class="t-h" x="461" y="235">Build</text>
<text class="t-m" x="433" y="256">factory-build.yml</text>
<text class="t-b" x="433" y="280">Claude agent writes code,</text>
<text class="t-b" x="433" y="296">voices; opens the PR</text>
<g class=""><rect class="pill" x="433" y="316" width="140" height="22" rx="11"/><text class="pt" x="442" y="331">factory:in-progress</text></g>
</g>
<g class="k-flow">
<rect class="shadow" x="611" y="194" width="172" height="160" rx="16"/>
<rect class="halo hc3" x="607" y="186" width="180" height="168" rx="20"/>
<rect class="card edge" x="611" y="190" width="172" height="160" rx="16"/>
<circle class="nb" cx="635" cy="230" r="12"/><text class="nt" x="635" y="234.5">4</text>
<text class="t-h" x="655" y="235">Checks</text>
<text class="t-m" x="627" y="256">pr-checks.yml</text>
<text class="t-b" x="627" y="280">All required checks:</text>
<text class="t-b" x="627" y="296">ci, lint, audit, specs,</text>
<text class="t-b" x="627" y="312">lighthouse, demo,</text>
<text class="t-b" x="627" y="328">CodeQL</text>
</g>
<g class="k-flow">
<rect class="shadow" x="805" y="194" width="172" height="160" rx="16"/>
<rect class="halo hc4" x="801" y="186" width="180" height="168" rx="20"/>
<rect class="card edge" x="805" y="190" width="172" height="160" rx="16"/>
<circle class="nb" cx="829" cy="230" r="12"/><text class="nt" x="829" y="234.5">5</text>
<text class="t-h" x="849" y="235">Review</text>
<text class="t-m" x="821" y="256">factory-review.yml</text>
<text class="t-b" x="821" y="280">4 agents in parallel:</text>
<text class="t-b" x="821" y="296">ux-ui, security,</text>
<text class="t-b" x="821" y="312">content, code</text>
<g class=""><rect class="pill" x="821" y="316" width="127" height="22" rx="11"/><text class="pt" x="830" y="331">factory:in-review</text></g>
</g>
<g class="k-flow">
<rect class="shadow" x="999" y="194" width="172" height="160" rx="16"/>
<rect class="halo hc5" x="995" y="186" width="180" height="168" rx="20"/>
<rect class="card edge" x="999" y="190" width="172" height="160" rx="16"/>
<circle class="nb" cx="1023" cy="230" r="12"/><text class="nt" x="1023" y="234.5">6</text>
<text class="t-h" x="1043" y="235">Gate</text>
<text class="t-m" x="1015" y="256">factory-gate.yml</text>
<text class="t-b" x="1015" y="280">Risky-file list, then</text>
<text class="t-b" x="1015" y="296">the gate agent picks</text>
<text class="t-b" x="1015" y="312">MERGE or HUMAN</text>
</g>
<path d="M1010 350 V390 H700 V432" stroke="var(--green)" stroke-width="2.5" fill="none" marker-end="url(#ah-green)"/>
<path d="M1038 350 V432" stroke="var(--orange)" stroke-width="2.5" fill="none" marker-end="url(#ah-orange)"/>
<rect class="lblbg" x="853" y="379" width="47" height="22" rx="11"/><text class="t-lbl t-green mid" x="876" y="394">MERGE</text>
<rect class="lblbg" x="1053" y="379" width="47" height="22" rx="11"/><text class="t-lbl t-orange mid" x="1076.5" y="394">HUMAN</text>
<g class="k-done">
