<path d="M980 204 H995" stroke="var(--teal)" stroke-width="2.5" fill="none" marker-end="url(#ah-teal)"/>
<g class="k-human">
<rect class="shadow" x="29" y="194" width="172" height="160" rx="16"/>
<rect class="halo hc0" x="25" y="186" width="180" height="168" rx="20"/>
<rect class="card edge" x="29" y="190" width="172" height="160" rx="16"/>
<circle class="nb" cx="53" cy="230" r="12"/><text class="nt" x="53" y="234.5">1</text>
<text class="t-h" x="73" y="235">Triage</text>
<text class="t-m" x="45" y="256">Sunny</text>
<text class="t-b" x="45" y="280">Sorts new issues:</text>
<text class="t-b" x="45" y="296">ready, backlog, wontfix</text>
<g class=""><rect class="pill" x="45" y="316" width="108" height="22" rx="11"/><text class="pt" x="54" y="331">factory:triage</text></g>
</g>
<g class="k-human">
<rect class="shadow" x="223" y="194" width="172" height="160" rx="16"/>
<rect class="halo hc1" x="219" y="186" width="180" height="168" rx="20"/>
<rect class="card edge" x="223" y="190" width="172" height="160" rx="16"/>
<circle class="nb" cx="247" cy="230" r="12"/><text class="nt" x="247" y="234.5">2</text>
<text class="t-h" x="267" y="235">Ready</text>
<text class="t-m" x="239" y="256">Sunny</text>
<text class="t-b" x="239" y="280">Label starts the scan:</text>
<text class="t-b" x="239" y="296">5 slots, also hourly</text>
<g class=""><rect class="pill" x="239" y="316" width="101" height="22" rx="11"/><text class="pt" x="248" y="331">factory:ready</text></g>
</g>
<g class="k-flow">
