<rect class="lblbg" x="580" y="81.5" width="201" height="22" rx="11"/><text class="t-lbl t-red mid" x="680.0" y="96.5">review fails: fix round, max 5</text>
<path d="M204 204 H219" stroke="var(--teal)" stroke-width="2.5" fill="none" marker-end="url(#ah-teal)"/>
