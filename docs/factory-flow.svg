<text class="t-m" x="576" y="498">sredhu37-bot, squash</text>
<text class="t-b" x="576" y="522">Issue gets factory:done,</text>
<text class="t-b" x="576" y="538">its card moves to Done</text>
</g>
<g class="k-human">
<rect class="shadow" x="906" y="436" width="265" height="118" rx="16"/>
<rect class="halo hh" x="902" y="428" width="273" height="126" rx="20"/>
<rect class="card edge" x="906" y="432" width="265" height="118" rx="16"/>
<text class="t-h" x="922" y="477">Needs human</text>
<text class="t-m" x="922" y="498">factory:human</text>
<text class="t-b" x="922" y="522">Slack to Sunny, with evidence video</text>
<text class="t-b" x="922" y="538">Approve: the bot merges</text>
</g>
